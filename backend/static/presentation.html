        let currentSlideIdx = 0;

        function renderSlide(idx) {
            currentSlideIdx = idx;
            const slide = SLIDES[idx];
            document.getElementById('slideCategory').innerText = slide.category;
            document.getElementById('slideTitle').innerText = slide.title;
            document.getElementById('slideContent').innerHTML = slide.render();
            document.getElementById('slideCounter').innerText = `Slide ${idx + 1} / ${SLIDES.length}`;
            document.getElementById('slideFooterCounter').innerText = `${idx + 1} of ${SLIDES.length}`;

            // Update active thumbnail
            document.querySelectorAll('.thumb-btn').forEach((btn, bidx) => {
                if (bidx === idx) {
                    btn.classList.add('active-thumb');
                } else {
                    btn.classList.remove('active-thumb');
                }
            });

            if (window.lucide) lucide.createIcons();
        }

        function nextSlide() {
            if (currentSlideIdx < SLIDES.length - 1) {
                renderSlide(currentSlideIdx + 1);
            } else {
                renderSlide(0); // loop
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                renderSlide(currentSlideIdx - 1);
            } else {
                renderSlide(SLIDES.length - 1);
            }
        }

        // Build thumbnail buttons
        function initThumbnails() {
            const container = document.getElementById('thumbContainer');
            if (!container) return;
            container.innerHTML = SLIDES.map((s, idx) => `
                <button onclick="renderSlide(${idx})" class="thumb-btn px-2.5 py-1 rounded text-[11px] font-mono border border-white/10 text-slate-400 hover:text-white transition whitespace-nowrap">
                    ${idx + 1}. ${s.title.slice(0, 18)}...
                </button>
            `).join('');
        }

        // Keyboard arrow listener
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                prevSlide();
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initThumbnails();
            renderSlide(0);
        });
    </script>
