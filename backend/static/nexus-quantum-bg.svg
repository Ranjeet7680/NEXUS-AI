<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Deep Gradient -->
    <radialGradient id="spaceGradient" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0a122c" />
      <stop offset="40%" stop-color="#05091a" />
      <stop offset="80%" stop-color="#02040b" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Glowing Light Blooms -->
    <radialGradient id="blueAura" cx="45%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleAura" cx="58%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAura" cx="50%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magentaAura" cx="52%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Gaussian Blurs -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Apple Intelligence Ribbon Linear Gradients -->
    <linearGradient id="ribbonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="ribbonGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="ribbonGrad3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Linear Perspective Grid Pattern -->
    <pattern id="dotGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <!-- Linear Fade Mask -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <mask id="gridMask">
      <rect width="1920" height="1080" fill="url(#gridFade)" />
    </mask>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1920" height="1080" fill="url(#spaceGradient)" />

  <!-- Ambient Light Orbs -->
  <circle cx="820" cy="380" r="600" fill="url(#blueAura)" />
  <circle cx="1120" cy="340" r="550" fill="url(#purpleAura)" />
  <circle cx="960" cy="280" r="450" fill="url(#cyanAura)" />
  <circle cx="960" cy="720" r="700" fill="url(#magentaAura)" />

  <!-- Perspective Dot Matrix Grid -->
  <rect width="1920" height="1080" fill="url(#dotGrid)" mask="url(#gridMask)" />

  <!-- Isometric Cybernetic Perspective Wireframe (Ground Plane) -->
  <g opacity="0.15" stroke="#3b82f6" stroke-width="0.75" fill="none">
    <line x1="960" y1="360" x2="-200" y2="1100" />
    <line x1="960" y1="360" x2="100" y2="1100" />
    <line x1="960" y1="360" x2="400" y2="1100" />
    <line x1="960" y1="360" x2="700" y2="1100" />
    <line x1="960" y1="360" x2="960" y2="1100" />
    <line x1="960" y1="360" x2="1220" y2="1100" />
    <line x1="960" y1="360" x2="1520" y2="1100" />
    <line x1="960" y1="360" x2="1820" y2="1100" />
    <line x1="960" y1="360" x2="2120" y2="1100" />

    <!-- Transverse Ellipses -->
    <ellipse cx="960" cy="520" rx="420" ry="85" />
    <ellipse cx="960" cy="660" rx="720" ry="145" />
    <ellipse cx="960" cy="840" rx="1100" ry="220" />
    <ellipse cx="960" cy="1060" rx="1550" ry="310" />
  </g>

  <!-- Glowing Quantum Core Rings -->
  <g opacity="0.35" fill="none">
    <circle cx="960" cy="380" r="280" stroke="url(#ribbonGrad1)" stroke-width="1" stroke-dasharray="8 12" />
    <circle cx="960" cy="380" r="390" stroke="url(#ribbonGrad2)" stroke-width="1.2" stroke-dasharray="16 20" />
    <circle cx="960" cy="380" r="510" stroke="url(#ribbonGrad3)" stroke-width="0.8" stroke-dasharray="4 16" opacity="0.5" />
  </g>

  <!-- Apple Intelligence Luminous Energy Ribbon 1 (Main Sweeping Wave) -->
  <path d="M -100 620 C 320 740, 680 220, 960 380 C 1240 540, 1600 280, 2020 440" 
        fill="none" 
        stroke="url(#ribbonGrad1)" 
        stroke-width="5" 
        filter="url(#superGlow)" 
        opacity="0.85" />
  
  <path d="M -100 620 C 320 740, 680 220, 960 380 C 1240 540, 1600 280, 2020 440" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        opacity="0.6" />

  <!-- Apple Intelligence Luminous Energy Ribbon 2 (Counter Harmonic) -->
  <path d="M -100 420 C 380 260, 720 560, 960 380 C 1200 200, 1560 520, 2020 320" 
        fill="none" 
        stroke="url(#ribbonGrad2)" 
        stroke-width="4" 
        filter="url(#superGlow)" 
        opacity="0.75" />

  <path d="M -100 420 C 380 260, 720 560, 960 380 C 1200 200, 1560 520, 2020 320" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        opacity="0.5" />

  <!-- Apple Intelligence Luminous Energy Ribbon 3 (Lower Horizon Echo) -->
  <path d="M -50 780 C 450 680, 780 480, 1020 540 C 1280 600, 1650 420, 2000 620" 
        fill="none" 
        stroke="url(#ribbonGrad3)" 
        stroke-width="3" 
        filter="url(#softGlow)" 
        opacity="0.5" />

  <!-- Floating Crystal Nodes & Constellation Stars -->
  <g fill="#ffffff">
    <circle cx="340" cy="280" r="2.5" opacity="0.6" />
    <circle cx="480" cy="180" r="1.5" opacity="0.4" />
    <circle cx="620" cy="310" r="2" opacity="0.7" />
    <circle cx="820" cy="190" r="3" opacity="0.8" filter="url(#softGlow)" />
    <circle cx="960" cy="140" r="2" opacity="0.5" />
    <circle cx="1120" cy="190" r="3" opacity="0.8" filter="url(#softGlow)" />
    <circle cx="1320" cy="290" r="2" opacity="0.6" />
    <circle cx="1480" cy="180" r="2.5" opacity="0.7" />
    <circle cx="1620" cy="340" r="1.5" opacity="0.4" />
    <circle cx="1740" cy="240" r="2" opacity="0.6" />
    
    <!-- Midground floating particles -->
    <circle cx="280" cy="620" r="2" opacity="0.5" />
    <circle cx="540" cy="740" r="1.5" opacity="0.3" />
    <circle cx="760" cy="580" r="2.5" opacity="0.7" filter="url(#softGlow)" />
    <circle cx="1180" cy="580" r="2.5" opacity="0.7" filter="url(#softGlow)" />
    <circle cx="1420" cy="720" r="1.5" opacity="0.4" />
    <circle cx="1680" cy="640" r="2" opacity="0.5" />
  </g>

  <!-- Constellation Connections -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.25" fill="none">
    <line x1="340" y1="280" x2="480" y2="180" />
    <line x1="480" y1="180" x2="620" y2="310" />
    <line x1="620" y1="310" x2="820" y2="190" />
    <line x1="820" y1="190" x2="960" y2="140" />
    <line x1="960" y1="140" x2="1120" y2="190" />
    <line x1="1120" y1="190" x2="1320" y2="290" />
    <line x1="1320" y1="290" x2="1480" y2="180" />
    <line x1="1480" y1="180" x2="1620" y2="340" />
  </g>

  <!-- Vignette Gradient Top & Bottom Edge Mask -->
  <rect width="1920" height="1080" fill="url(#spaceGradient)" opacity="0.3" />
</svg>
