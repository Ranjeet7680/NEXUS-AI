<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="40%" stop-color="#0A1022" />
      <stop offset="100%" stop-color="#070C1A" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glowBlue" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E7FF" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <!-- Drop Shadow Filters -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="380" rx="16" fill="url(#glowBlue)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowPurple)" />
  <rect width="1200" height="380" rx="16" fill="url(#glowCenter)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Decorative Constellation Lines & Nodes -->
  <g opacity="0.35">
    <line x1="80" y1="120" x2="210" y2="70" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="210" y1="70" x2="320" y2="130" stroke="#818CF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="880" y1="90" x2="1000" y2="60" stroke="#818CF8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="1000" y1="60" x2="1120" y2="120" stroke="#C084FC" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="1120" y1="120" x2="1050" y2="240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3" />
    
    <circle cx="80" cy="120" r="3" fill="#38BDF8" />
    <circle cx="210" cy="70" r="4" fill="#818CF8" />
    <circle cx="320" cy="130" r="3" fill="#C084FC" />
    <circle cx="880" cy="90" r="3" fill="#818CF8" />
    <circle cx="1000" cy="60" r="4" fill="#38BDF8" />
    <circle cx="1120" cy="120" r="3.5" fill="#C084FC" />
    <circle cx="1050" cy="240" r="3" fill="#38BDF8" />
  </g>

  <!-- Top Badge: Platform Pill -->
  <g transform="translate(600, 56)" text-anchor="middle" class="font-sans">
    <rect x="-185" y="-16" width="370" height="32" rx="16" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1.2" filter="url(#pillShadow)" />
    <!-- Live Pulse Indicator -->
    <circle cx="-160" cy="0" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-146" y="4.5" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE MULTI-AGENT SWARM PLATFORM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 142)" text-anchor="middle" class="font-sans">
    <text x="0" y="0" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#titleGrad)" filter="url(#shadowGlow)">NEXUS · AI</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)" text-anchor="middle" class="font-sans">
    <text x="0" y="0" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Autonomous Multi-Agent Intelligence &amp; Stateful Workflow Orchestration
    </text>
    <text x="0" y="26" font-size="14" font-weight="400" fill="#64748B" letter-spacing="0.4">
      One Intelligent Platform · 7 Autonomous Agents · Cryptographic HITL Gateway · Real-World Impact
    </text>
  </g>

  <!-- Key Architecture Feature Badges -->
  <g transform="translate(600, 275)" text-anchor="middle" class="font-sans">
    <!-- Pill 1: 7 Autonomous Agents -->
    <g transform="translate(-400, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="-62" cy="0" r="5" fill="#38BDF8" />
      <text x="-48" y="4.5" text-anchor="start" fill="#E2E8F0" font-size="12" font-weight="600">7-Agent Swarm</text>
    </g>

    <!-- Pill 2: LangGraph DAG -->
    <g transform="translate(-200, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="-62" cy="0" r="5" fill="#818CF8" />
      <text x="-48" y="4.5" text-anchor="start" fill="#E2E8F0" font-size="12" font-weight="600">Stateful DAG Engine</text>
    </g>

    <!-- Pill 3: Real-Time SSE Stream -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="-62" cy="0" r="5" fill="#10B981" />
      <text x="-48" y="4.5" text-anchor="start" fill="#E2E8F0" font-size="12" font-weight="600">Real-Time SSE Stream</text>
    </g>

    <!-- Pill 4: HITL Security Gateway -->
    <g transform="translate(200, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="-62" cy="0" r="5" fill="#F59E0B" />
      <text x="-48" y="4.5" text-anchor="start" fill="#E2E8F0" font-size="12" font-weight="600">HITL Approval Gate</text>
    </g>

    <!-- Pill 5: Dual Domain BI & Health -->
    <g transform="translate(400, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="-62" cy="0" r="5" fill="#EC4899" />
      <text x="-48" y="4.5" text-anchor="start" fill="#E2E8F0" font-size="12" font-weight="600">Dual-Domain AI</text>
    </g>
  </g>

  <!-- Bottom Terminal / Telemetry Accent Bar -->
  <g transform="translate(600, 335)" text-anchor="middle" class="font-mono">
    <text x="0" y="0" font-size="11" fill="#475569" letter-spacing="1">
      KERNEL: ACTIVE // ORCHESTRATOR: v2.0.0 // PROTOCOL: SSE+REST // GROUNDING AUDIT: 97.4% CERTIFIED
    </text>
  </g>
</svg>
